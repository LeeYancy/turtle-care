server:
  port: 8080

spring:
  application:
    name: turtle-care

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/turtlecare
    username: ${DB_USER:turtlecare}
    password: ${DB_PASSWORD:turtlecare}
    driver-class-name: org.postgresql.Driver

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:please-change-this-default-secret-key-now}
  expiration: 604800000  # 7 days

# AI / LLM
llm:
  provider: ${LLM_PROVIDER:mock}  # mock | openai | anthropic
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    health-model: gpt-4o
    base-url: https://api.openai.com/v1
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-haiku-20240307
    health-model: claude-3-5-sonnet-20241022

# OSS
oss:
  provider: ${OSS_PROVIDER:aliyun}  # aliyun | tencent
  aliyun:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: turtlecare-images

# Rate Limiting
rate-limit:
  ai:
    capacity: 50        # 每用户每天AI调用上限
    refill-rate: 5      # 每小时恢复次数

# Logging
logging:
  level:
    com.turtlecare: DEBUG
    org.springframework.security: INFO
