spring:
  datasource:
    url: jdbc:h2:mem:turtlecare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

llm:
  provider: mock

oss:
  provider: mock

jwt:
  secret: test-secret-key-at-least-32-characters-long-for-testing
  expiration: 3600000

logging:
  level:
    com.turtlecare: TRACE
