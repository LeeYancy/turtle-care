version: '3.8'

# Production docker-compose
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: turtlecare-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:turtlecare}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - turtlecare-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: turtlecare-redis-prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - turtlecare-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Spring Boot 后端
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/turtle-care/turtlecare}/backend:${IMAGE_TAG:-latest}
    container_name: turtlecare-backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - turtlecare-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Frontend (Nginx serving Flutter Web + reverse proxy)
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/turtle-care/turtlecare}/frontend:${IMAGE_TAG:-latest}
    container_name: turtlecare-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: always
    networks:
      - turtlecare-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  turtlecare-net:
    driver: bridge
