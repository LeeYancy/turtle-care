version: '3.8'

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: turtlecare-postgres
    environment:
      POSTGRES_DB: turtlecare
      POSTGRES_USER: turtlecare
      POSTGRES_PASSWORD: turtlecare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtlecare"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - turtlecare-net

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: turtlecare-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - turtlecare-net

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turtlecare-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USER=turtlecare
      - DB_PASSWORD=turtlecare
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLM_PROVIDER=mock
      - JWT_SECRET=dev-secret-key-change-in-production-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - turtlecare-net

  # Nginx 反向代理 (同时服务前端Web + 后端API)
  nginx:
    image: nginx:alpine
    container_name: turtlecare-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - turtlecare-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  turtlecare-net:
    driver: bridge
